# Meelano VPN — build-wide JVM/Gradle settings.
org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8 -Duser.language=en
org.gradle.parallel=true
org.gradle.caching=true
# Configuration cache stays OFF on purpose: variant selection and the feed credentials are read from
# -P / local.properties at *configuration* time, so a cached configuration would happily reuse yesterday's
# SELF_UPDATE=true (or the test key) for a production build. That is the one class of bug that ships a
# signed APK with the wrong policy. Turn it on only if the build script re-reads these per run.
org.gradle.configuration-cache=false

# Kotlin: incremental compilation is the single biggest iteration speed-up on a small team
kotlin.incremental=true
kotlin.incremental.useClasspathSnapshot=true
kotlin.code.style=official

android.useAndroidX=true
# (android.defaults.buildfeatures.buildconfig و nonTransitiveRClass عمداً حذف شدند: در AGP 8 بی‌اثر/
#  منسوخ‌اند و فقط warning می‌دادند؛ buildConfig در app/build.gradle.kts صریحاً روشن است.)
android.nonFinalResIds=true
# AGP 8.6 + compileSdk 35: keep the "not fully tested" warning from becoming an error in CI
android.suppressUnsupportedCompileSdk=35

# Do NOT turn on android.enableAppCompileTimeRClass or resource shrinking aggressively without a
# test install from the host: self-update means the signed artifact is the one place a build flag
# can brick every existing user at once.
