name: build apk

# این workflow تنها راه رسیدن به یک APK واقعی است، چون build اندروید به Android SDK +
# Maven Central نیاز دارد که در محیط توسعه‌ی ما در دسترس نیست. رانرهای GitHub هر دو را دارند.
#
# نحوه‌ی استفاده:
#   1) Actions ▸ “build apk” ▸ Run workflow  (variant=debug برای تست روی گوشی)
#   2) از Artifact دانلود کن: meelano-<name>-<code>-debug.apk
#   2b) یا فقط یک تگ بزن:  git tag v2.0.0-beta.1 && git push origin v2.0.0-beta.1
#       ⇒ بیلد گرفته می‌شود و Release با لینک مستقیم ساخته می‌شود (این خودکارترین راه است)
#   3) برای ریلیز امضاشده: سه secret زیر را پر کن و variant=release بزن
#        MEELANO_KEYSTORE_B64   -> base64 -w0 meelano.keystore
#        MEELANO_KEY_PASS       -> keyPassword
#        MEELANO_STORE_PASS     -> storePassword
#        MEELANO_KEY_ALIAS      -> alias
#   4) فایل نهایی را با همان نام public_html/v/apk/meelano-<name>-<code>.apk بگذار؛
#      بک‌اند خودش version.json را از روی نام فایل می‌سازد (backend/v/lib/Version.php).
#
# عمداً اینجا «نسخه‌ی ساخت» و «نسخه‌ی APK» یکی شده‌اند تا versionCode/Name از app/build.gradle.kts
# خوانده شود — دو جا نگه‌داشتن نسخه، همان چیزی است که باعث می‌شود آپدیت خودکار بی‌صدا کار نکند.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'debug (قابل نصب روی گوشی تست) یا release (امضای خودت)'
        type: choice
        required: true
        default: debug
        options: [debug, release]
      feed_base:
        description: 'MEELANO_FEED_BASE'
        required: true
        default: 'https://ainetmee.ir/v'
      feed_key:
        description: 'MEELANO_FEED_KEY (اختیاری؛ هدر دسترسی فید)'
        required: false
        default: ''
      core_linked:
        description: 'هسته‌ی تونل به این بیلد وصل است؟ (false = فقط UI/فید/آپدیت؛ ریلیز با false رد می‌شود)'
        type: choice
        required: true
        default: 'false'
        options: ['false', 'true']
      self_update:
        description: 'اجازه‌ی خودآپدیت در این بیلد (true/false)'
        type: choice
        required: true
        default: 'true'
        options: ['true', 'false']
  push:
    # main = نردبان سبز؛ تگ = دکمه‌ی انتشار (Release با لینک مستقیم). چرا تگ و نه dispatch:
    # dispatch کردن workflow به اجازه‌ی actions:write نیاز دارد که توکن محیط توسعه ندارد،
    # ولی push تگ با همان اجازه‌ی push کار می‌کند. برای tag، فیلتر paths روی تغییرات
    # کامیتِ تگ اعمال می‌شود — و تگ همیشه روی کامیتی می‌خورد که android/** را لمس کرده.
    branches: [main]
    # `bootstrap-key-*` مسیرِ صریحِ بوت‌استرپ است (کلید روی رانر ساخته و در draft تحویل می‌شود).
    # عمداً از `v` شروع نمی‌شود تا با تگ‌های نسخه اشتباه گرفته نشود و ورک‌فلوی variant آن را
    # «release معمولی» فرض نکند.
    tags: ['v*', 'bootstrap-key-*']
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'
  # workflow_dispatch فقط وقتی در منوی Actions ظاهر می‌شود که فایل روی شاخه‌ی پیش‌فرض باشد؛
  # تا آن زمان، همین workflow روی PR اجرا می‌شود و همان APK را می‌دهد.
  pull_request:
    branches: [main]
    # `labeled` عمداً در لیست است: تمرینِ release با گذاشتنِ برچسب شروع می‌شود و رویدادهای
    # pull_request به‌صورت پیش‌فرض فقط opened/synchronize/reopenedاند — یعنی بدون این خط،
    # `gh pr edit --add-label release-dry-run` هیچ رانی نمی‌ساخت و برچسب بی‌اثر می‌ماند.
    # (هر برچسبِ دیگری هم یک رانِ معمولیِ debug می‌سازد؛ برای مخزنی با چند برچسب، بهای قابل‌قبول.)
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  # contents:write فقط برای یک چیز لازم است: ساختن Release با asset. build چیزی را commit نمی‌کند.
  # issues:write برای همان مرحله‌ی «report to PR» لازم است: کامنت روی PR بدون آن ۴۰۳ می‌گیرد و
  # `|| true` آن را بی‌صدا می‌کند — دقیقاً همان چیزی که یک خطای روشن را به «بیلد قرمزِ بی‌دلیل»
  # تبدیل می‌کند. (pull-requests:write برای comment کافی نیست؛ مسیر API زیرمسئله‌ی issues است.)
  contents: write
  pull-requests: write
  issues: write

env:
  ANDROID_HOME: ${{ github.workspace }}/android-sdk
  GRADLE_USER_HOME: ${{ github.workspace }}/.gradle-home
  # XTLS/libXray CalVer، پین‌شده عمداً: موتور را یک‌جا عوض کن، نه در هر بیلد به‌صورت سرنوشت‌محور.
  # این تگ go.mod خودش xray-core را هم قفل کرده، پس با آپدیت این یک خط، جفت با هم می‌آیند.
  LIBXRAY_TAG: v26.9.9

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: android sdk
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: 'false'

      # ── دو تصمیمِ کلیدیِ این workflow، یک‌جا و یک‌بار: (variant) و (آیا هسته ساخته شود).
      #    چرا variant از نام تگ استنتاج می‌شود: dispatch نیاز به actions:write دارد که توکن‌های
      #    معمولی ندارند، ولی push تگ همان کار را با اجازه‌ی push می‌کند — پس اگر variant فقط
      #    ورودیِ dispatch بود، «تگ = انتشار» یعنی همیشه debug (و تا v2.5.0-beta.1 همین‌طور بود).
      #    قاعده: تگ دارای alpha/beta/rc = پیش‌انتشار (debug، برای تست روی گوشی)؛ تگ تمیزِ
      #    vX.Y.Z = نسخه‌ی نهایی (release، امضاشده با keystore پروژه). ورودیِ dispatch برنده است.
      #    چرا «هسته» هم این‌جاست: قبلاً همین شرطِ بلند در چهار step تکرار شده بود و هر ویرایشِ
      #    یکی، بقیه را جا می‌گذاشت (تفاوت = بیلد core-linked که خودش را بی‌هسته می‌داند).
      #    و چرا PRِ برچسب‌خورده‌ی `release-dry-run`: راهی برای تمرینِ کل مسیر release (R8 + امضا +
      #    apksigner) و گرفتنِ APKِ امضاشده به‌عنوان artifact، *بدون* منتشرکردنِ چیزی.
      - name: resolve variant + core
        id: vr
        run: |
          set -euo pipefail
          # کاما در دو طرف الزامی است: `,release-dry-run` (بدون کامای آخر) با الگوی
          # `*,release-dry-run,*)` جور نمی‌شود و برچسب بی‌صدا نادیده می‌ماند
          labels=",${{ join(github.event.pull_request.labels.*.name, ',') }},"
          dry=false
          if [ "${{ github.event_name }}" = pull_request ]; then
            case "$labels" in *,release-dry-run,*) dry=true ;; esac
          fi
          v="${{ inputs.variant }}"
          if [ -z "$v" ]; then
            case "${GITHUB_REF_NAME:-}" in
              *alpha*|*beta*|*rc*) v=debug ;;
              v[0-9]*)             v=release ;;
              *)                   v=debug ;;
            esac
          fi
          [ "$dry" = true ] && v=release
          # ── مسیرِ بوت‌استرپِ کلید: وقتی secretها به هر دلیلی به run نمی‌رسند، تنها راهِ رسیدن به
          #    یک APK *امضاشده* این است که کلید را همین‌جا (روی رانر) بسازیم. عمداً با یک پیشوندِ
          #    صریح و نامتعارف (`bootstrap-key-*`) فعال می‌شود تا هیچ تگِ معمولی — و هیچ فراموشیِ
          #    secret — بی‌صدا به «کلیدِ یک‌بارمصرف» تبدیل نشود (خطِ پایین همان تگ را سخت رد می‌کند).
          #    کلید و رمزهایش به‌صورت draft release برمی‌گردند (draft برای عموم نامرئی است) تا
          #    صاحبِ مخزن آن را بردارد و برای همیشه نگه دارد؛ ریلیزِ عمومی فقط APK را دارد.
          bootstrap=false
          case "${GITHUB_REF_NAME:-}" in bootstrap-key-*) bootstrap=true ;; esac
          [ "$bootstrap" = true ] && v=release
          core=false
          if [ "${{ github.event_name }}" = workflow_dispatch ] && [ "${{ inputs.core_linked }}" != "false" ]; then core=true; fi
          if [ "$dry" = true ]; then core=true; fi
          if [ "$bootstrap" = true ]; then core=true; fi
          case "${GITHUB_REF:-}" in refs/tags/*) core=true ;; esac
          # بیلد بدونِ هسته، VPN نیست: اگر release خواسته شده و هیچ‌چیز هسته را نمی‌سازد،
          # همین‌جا با پیامِ روشن بایست — نه اینکه gradle وسط build با GradleException بترکد
          if [ "$v" = release ] && [ "$core" != true ]; then
            echo "::error::variant=release یعنی تونل باید باشد، ولی هیچ شرطی هسته را نمی‌سازد (core_linked=false در dispatch؟)"
            exit 1
          fi
          echo "variant=$v" >> "$GITHUB_OUTPUT"
          echo "core=$core" >> "$GITHUB_OUTPUT"
          echo "dry_run=$dry" >> "$GITHUB_OUTPUT"
          echo "bootstrap=$bootstrap" >> "$GITHUB_OUTPUT"
          echo "### variant: $v · core: $core · bootstrap-key: $bootstrap$( [ "$dry" = true ] && echo ' · **dry-run** (هیچ ریلیزی منتشر نمی‌شود)' )" >> "$GITHUB_STEP_SUMMARY"

      # gradle بدون wrapper: مخزن عمداً gradle-wrapper.jar (باینری) را نگه نمی‌دارد؛
      # این اکشن توزیع را نصب می‌کند و کش می‌کند. نسخه با AGP 8.6 هماهنگ است.
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-read-only: false

      - name: keystore (release only)
        id: ks
        if: ${{ steps.vr.outputs.variant == 'release' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KS_B64: ${{ secrets.MEELANO_KEYSTORE_B64 }}
          STORE_PASS_IN: ${{ secrets.MEELANO_STORE_PASS }}
          KEY_PASS_IN: ${{ secrets.MEELANO_KEY_PASS }}
          ALIAS_IN: ${{ secrets.MEELANO_KEY_ALIAS }}
          BOOTSTRAP: ${{ steps.vr.outputs.bootstrap }}
        run: |
          set -euo pipefail
          # چرا چهار بررسی جدا و نه یک `[ -z "$KS_B64" ]`: تجربه‌ی واقعیِ همین مخزن — وقتی
          # secretها نامرئی‌اند، «می‌گوید تنظیم نشده» کافی نیست؛ باید بگوید *کدام‌ها* و *چرا*.
          # سه علتِ رایج، به‌ترتیبِ احتمال: تب Variables به‌جای Secrets، مخزن/فورکِ دیگر، و
          # secretهای Organization بدون دسترسیِ این مخزن.
          ALIAS="${ALIAS_IN:-meelano}"
          missing=""
          if [ -z "${KS_B64:-}" ];      then missing="$missing MEELANO_KEYSTORE_B64"; fi
          if [ -z "${STORE_PASS_IN:-}" ]; then missing="$missing MEELANO_STORE_PASS"; fi
          if [ -z "${KEY_PASS_IN:-}" ]; then missing="$missing MEELANO_KEY_PASS"; fi
          if [ -z "${ALIAS_IN:-}" ];    then missing="$missing MEELANO_KEY_ALIAS"; fi
          KS="$GITHUB_WORKSPACE/meelano.keystore"
          if [ -z "$missing" ]; then
            # مسیر عادی: کلید از secretها می‌آید
            STORE_PASS="$STORE_PASS_IN"; KEY_PASS="$KEY_PASS_IN"
            printf '%s' "$KS_B64" | base64 -d > "$KS"
          elif [ "$BOOTSTRAP" = "true" ]; then
            # ── بوت‌استرپِ کلید (فقط با تگِ صریحِ `bootstrap-key-*`): کلید را روی همین رانر
            #    می‌سازیم تا راهی برای رسیدن به یک APK *امضاشده* بماند وقتی secretها نمی‌رسند.
            #    کلید + رمزها به‌صورت draft release برمی‌گردند (draft برای عموم نامرئی است) و
            #    ریلیزِ عمومی فقط APK را دارد. امضا با signTool خودِ Gradle انجام می‌شود که
            #    همان apksig رسمی است — نه ابزار دست‌ساز.
            echo "::warning::بوت‌استرپِ کلید فعال شد؛ secretهای نامرئی:$missing"
            STORE_PASS="$(openssl rand -hex 24)"
            # رمزِ کلید = رمزِ انبار. چرا: مخزنِ پیش‌فرضِ JDK 9+ **PKCS12** است و در PKCS12
            # رمزِ کلید همیشه رمزِ انبار است؛ keytool مقدارِ `-keypass` را بی‌صدا نادیده می‌گیرد و
            # بعد Gradle با keyPasswordِ متفاوت سرِ packageRelease می‌شکند (همین اتفاق افتاد).
            KEY_PASS="$STORE_PASS"
            keytool -genkeypair -v -keystore "$KS" -alias "$ALIAS" \
              -keyalg RSA -keysize 4096 -validity 10950 \
              -storepass "$STORE_PASS" -keypass "$KEY_PASS" \
              -dname "CN=M•A VPN, O=Meelano, C=IR" >/dev/null
            # پروف‌خوانی: کلید واقعاً با همین رمز/alias خوانده می‌شود؟ اگر نه، همین‌جا با پیامِ
            # روشن بایست — نه ۸ دقیقه بعد، وسطِ packageRelease با stack trace گرادِل.
            keytool -list -keystore "$KS" -storepass "$STORE_PASS" -alias "$ALIAS" >/dev/null \
              || { echo "::error::keystoreِ ساخته‌شده با رمز/alias خوانده نشد (alias=$ALIAS)"; exit 1; }
            {
              echo "M•A VPN — کلید امضای انتشار (بوت‌استرپِ CI)"
              echo "ساخته‌شده: $(date -u '+%Y-%m-%d %H:%M UTC')"
              echo
              echo "alias    : $ALIAS"
              echo "storePass: $STORE_PASS"
              echo "keyPass  : $KEY_PASS"
              echo
              echo "این فایل را نگه دار؛ برای اینکه انتشارهای بعدی با همین کلید امضا شوند:"
              echo "  openssl base64 -A -in meelano.keystore > ks.b64"
              echo "  gh secret set MEELANO_KEYSTORE_B64 --repo $GITHUB_REPOSITORY < ks.b64 && rm ks.b64"
              echo "  printf '%s' '<storePass>' | gh secret set MEELANO_STORE_PASS --repo $GITHUB_REPOSITORY"
              echo "  printf '%s' '<keyPass>'   | gh secret set MEELANO_KEY_PASS   --repo $GITHUB_REPOSITORY"
              echo "  printf '%s' '$ALIAS'      | gh secret set MEELANO_KEY_ALIAS  --repo $GITHUB_REPOSITORY"
              echo "بعد این draft release را پاک کن (تنها نسخه‌ی کلید همین فایل است)."
            } > "$GITHUB_WORKSPACE/keystore-credentials.txt"
            echo "bootstrap_key=1" >> "$GITHUB_OUTPUT"
          else
            # ── مسیرِ fallback (۲.۸.۰): کلیدِ امضای پروژه در draft release «key-bootstrap-2.6.0»
            #    نگه داشته شده. وقتی secretهای MEELANO_* ست نشده‌اند (دسترسیِ ست‌کردن در همه‌ی
            #    محیط‌ها نیست)، همان کلید را زمانِ اجرا از draft می‌خوانیم تا نسخه با *همان*
            #    گواهیِ v2.6.0 امضا شود — کلیدِ تازه یعنی به‌روزرسانی روی نصب‌های قبلی رد می‌شود،
            #    و به همین دلیل مسیرِ bootstrap-key هرگز نباید پایِ تگ‌های v* اجرا شود.
            #    امنیت: draft فقط برای دارندگانِ دسترسیِ push دیدنی است — همان مرزی که secretهای
            #    Actions را محافظت می‌کند (هرکس بتواند workflow را ویرایش کند به هر دو دسترسی دارد).
            #    اگر روزی secretها ست شوند، شاخه‌ی اولِ پایین‌تر (مسیر عادی) برنده می‌شود و می‌توان
            #    draft را حذف کرد. رمزها هرگز در لاگ چاپ نمی‌شوند؛ فقط keytool تأییدشان می‌کند.
            if [ "$GITHUB_EVENT_NAME" != "pull_request" ] && command -v gh >/dev/null 2>&1; then
              kd="$RUNNER_TEMP/keydraft"
              rm -rf "$kd" && mkdir -p "$kd"
              if gh release download "key-bootstrap-2.6.0" --repo "$GITHUB_REPOSITORY" \
                   --pattern meelano.keystore --pattern keystore-credentials.txt \
                   --dir "$kd" >/dev/null 2>&1 && [ -s "$kd/meelano.keystore" ]; then
                cred="$kd/keystore-credentials.txt"
                STORE_PASS="$(sed -n 's/^storePass[[:space:]]*:[[:space:]]*//p' "$cred" | head -1 | tr -d '\r')"
                KEY_PASS="$(sed -n 's/^keyPass[[:space:]]*:[[:space:]]*//p' "$cred" | head -1 | tr -d '\r')"
                parsed_alias="$(sed -n 's/^alias[[:space:]]*:[[:space:]]*//p' "$cred" | head -1 | tr -d '\r')"
                [ -n "$parsed_alias" ] && ALIAS="$parsed_alias"
                cp "$kd/meelano.keystore" "$KS"
                if [ -n "$STORE_PASS" ] && [ -n "$KEY_PASS" ] && \
                   keytool -list -keystore "$KS" -storepass "$STORE_PASS" -alias "$ALIAS" >/dev/null 2>&1; then
                  echo "::warning::secretهای MEELANO_* ست نشده‌اند؛ کلید امضای پروژه از draftِ key-bootstrap-2.6.0 خوانده شد و امضا با همان گواهی انجام می‌شود."
                  missing=""
                else
                  echo "::error::فایلِ کلید از draft خوانده شد ولی storePass/keyPass/alias آن با keytool تأیید نشد."
                fi
              else
                echo "::error::دریافتِ کلید از draftِ key-bootstrap-2.6.0 ناموفق بود (gh release download)."
              fi
            fi
            # دو حالتِ متفاوت، دو رفتارِ متفاوت:
            #  • روی PR (تمرینِ release): بدون کلید هم بیلد می‌گیریم تا R8/منابع/تست‌ها سنجیده
            #    شوند، ولی خروجی «unsigned» مهر می‌شود و از PR هیچ ریلیزی منتشر نمی‌شود. همین APK
            #    را می‌توان بیرون از CI امضا و منتشر کرد (tools/sign-apk.sh).
            #  • روی تگِ معمولی: سخت‌گیر. انتشار یک APK بی‌امضا بدتر از منتشر نکردن است، و
            #    «موفقِ بی‌صدا» بدترین حالت: کاربر فایل را می‌گیرد و نصب نمی‌شود.
            if [ -n "$missing" ] && [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
              echo "::warning::بدونِ کلید امضا اجرا می‌شود (unsigned dry-run):$missing"
              echo "signing=unsigned" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ -n "$missing" ]; then
              echo "::error::این secretها برای این run قابل‌دیدن نیستند:$missing"
              echo "::error::الف) در Actions ▸ Secrets ست شده باشند، نه Variables (این‌ها رمزند). ب) روی همین مخزن $GITHUB_REPOSITORY باشند، نه فورک/مخزنِ دیگر."
              echo "::error::ج) اگر Organization secret است، دسترسیِ همین مخزن باید تیک داشته باشد. تأیید: 'gh secret list --repo $GITHUB_REPOSITORY'"
              echo "::error::د) مسیرِ fallback (draftِ key-bootstrap-2.6.0) هم نتوانست کلید را بخواند — یا آن draft پاک شده، یا رمز/alias آن با keytool نخواند."
              echo "::error::ساختِ دوباره: ./tools/make-signing-key.sh  (کلید را بازنویسی نمی‌کند مگر FORCE=1)"
              exit 1
            fi
          fi
          # نوع keystore را از خودِ فایل تشخیص بده: JKS با جادوی FE ED FE ED شروع می‌شود (در hex
          # می‌شود `feedfeed`)، بقیه PKCS12. چرا اصلاً مهم است: پیش‌فرضِ JVM از JDK 9 به بعد PKCS12
          # است، پس یک .jks قدیمی بدون این خط با «password was incorrect» می‌شکند — پیامی که هیچ
          # ربطی به رمز ندارد.
          magic=$(head -c 4 "$KS" | od -An -tx1 | tr -d ' \n')
          case "$magic" in
            feedfeed) ks_type=JKS ;;
            *)        ks_type=PKCS12 ;;
          esac
          echo "keystore type: $ks_type (magic $magic)"
          cat > android/keystore.properties <<EOF
          storeFile=$KS
          storePassword=$STORE_PASS
          keyAlias=$ALIAS
          keyPassword=$KEY_PASS
          storeType=$ks_type
          EOF
          echo "signing=signed" >> "$GITHUB_OUTPUT"
      - name: version from gradle
        id: ver
        working-directory: android
        run: |
          set -euo pipefail
          code=$(grep -oP 'versionCode = \K[0-9_]+' app/build.gradle.kts | tr -d '_')
          name=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "### نسخه: $name ($code)" >> "$GITHUB_STEP_SUMMARY"

      - name: bundle a verified public bootstrap snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets
          src="$RUNNER_TEMP/public-bootstrap-source.txt"
          # This is a safety net, not a private feed: the same MIT-licensed public document is fetched
          # live by DirectFeed. Embedding a small build-time sample means DNS/CDN filtering cannot turn
          # a brand-new install into an unexplained zero-node screen before the first mirror succeeds.
          if ! gh api -H 'Accept: application/vnd.github.raw+json' \
              'repos/0xRadikal/Free-v2ray-Configs/contents/verified/configs.txt?ref=main' > "$src"; then
            echo '::warning::verified bootstrap source unavailable; building with live public mirrors only'
            exit 0
          fi
          python3 - "$src" android/app/src/main/assets/public-bootstrap.txt <<'PY'
          import collections, pathlib, sys
          source, target = map(pathlib.Path, sys.argv[1:])
          schemes = ('vless', 'vmess', 'trojan', 'ss')
          buckets = collections.OrderedDict((s, []) for s in schemes)
          seen = set()
          for raw in source.read_text('utf-8', errors='ignore').splitlines():
              line = raw.strip()
              scheme = line.partition('://')[0].lower()
              if scheme not in buckets or line in seen:
                  continue
              seen.add(line)
              if len(buckets[scheme]) < 24:
                  buckets[scheme].append(line)
          rows = []
          for index in range(24):
              for scheme in schemes:
                  if index < len(buckets[scheme]):
                      rows.append(buckets[scheme][index])
          if len(rows) < 16:
              raise SystemExit('verified bootstrap unexpectedly contained fewer than 16 supported configs')
          target.write_text(
              '# Generated at APK build time from 0xRadikal/Free-v2ray-Configs verified/configs.txt\n' +
              '\n'.join(rows) + '\n', encoding='utf-8'
          )
          print('bundled', len(rows), 'verified public configs:',
                ', '.join(f'{name}={len(values)}' for name, values in buckets.items()))
          PY

      # ── هسته‌ی تونل: XTLS/libXray را در تگ سنجیده‌شده می‌سازیم و AAR را در app/libs می‌گذاریم.
      #    روی تگ همیشه (آن چیزی است که کاربر نصب می‌کند) و روی dispatch — نه روی PRها (رانر ۹۰ ثانیه‌ای را
      #    سنگین نکند). کلاسِ واگرفکننده با javap استخراج می‌شود، نه حدس، و انعطاف‌شکنیِ رشته‌ای اینجاست:
      #    اگر upstream نام invoke را عوض کرد، همین step قرمز می‌شود — نه کاربرِ اپ.
      - uses: actions/setup-go@v5
        if: ${{ steps.vr.outputs.core == 'true' }}
        with:
          go-version: '1.27'
          check-latest: true

      - name: cache libXray core
        id: core-cache
        if: ${{ steps.vr.outputs.core == 'true' }}
        uses: actions/cache@v4
        with:
          path: android/app/libs/core.aar
          # tag های CalVer دست‌نخورده‌اند؛ کلید = خود تگ. نسخه‌ی xray-core داخل go.mod همان تگ قفل است.
          key: libxray-core-${{ env.LIBXRAY_TAG }}-${{ hashFiles('android/app/src/main/java/ir/meelano/vpn/vpn/XrayBridge.kt', 'tools/libxray-android-tun.patch') }}

      - name: build the tunnel core (XTLS/libXray, pinned)
        id: core
        if: ${{ steps.vr.outputs.core == 'true' && steps.core-cache.outputs.cache-hit != 'true' }}
        env:
          ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk-bundle
        run: |
          set -euo pipefail
          # NDK: ubuntu-24.04 چند NDK دارد؛ آخرین را انتخاب کن (path نصب‌شده‌ی پیش‌فرض رانرها)
          if [ ! -d "$ANDROID_NDK_HOME" ]; then
            ANDROID_NDK_HOME=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)
          fi
          echo "using NDK: $ANDROID_NDK_HOME"
          export ANDROID_NDK_HOME PATH="$PATH:$(go env GOPATH)/bin"
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          gomobile init
          git clone --depth 1 --branch "$LIBXRAY_TAG" https://github.com/XTLS/libXray /tmp/libxray
          cd /tmp/libxray
          # Upstream Xray reads the Android TUN number from the process environment. A JSON `env`
          # member does not set that environment, so expose the tiny, typed gomobile handoff we use.
          git apply "$GITHUB_WORKSPACE/tools/libxray-android-tun.patch"
          gofmt -w android_wrapper.go
          grep -q 'func AttachTunFd(fd int32)' android_wrapper.go
          python3 build/main.py android
          mkdir -p "$GITHUB_WORKSPACE/android/app/libs"
          cp libXray.aar "$GITHUB_WORKSPACE/android/app/libs/core.aar"

      - name: verify the bridge contract inside the AAR
        id: bridge
        if: ${{ steps.vr.outputs.core == 'true' }}
        run: |
          set -euo pipefail
          cd android/app/libs
          unzip -o -q core.aar classes.jar
          # نه حدس: کلاسِ واگرفکننده را از خودِ جار بخوان (لاجیک در XrayBridge.kt)
          bridge=$(jar tf classes.jar | grep -E '(^|/)LibXray\.class$' | grep -v '\$' | head -1 | sed 's;/;.;g; s;\.class$;;')
          if [ -z "$bridge" ]; then
            echo "::error::no LibXray wrapper class inside classes.jar"
            jar tf classes.jar | grep -i '\.class$' | head -20
            exit 1
          fi
          javap -classpath classes.jar -public "$bridge" | tee /tmp/bridge.txt
          grep -q 'invoke' /tmp/bridge.txt
          grep -q 'registerDialerController' /tmp/bridge.txt
          grep -q 'setDNS' /tmp/bridge.txt
          grep -q 'attachTunFd' /tmp/bridge.txt
          grep -q 'detachTunFd' /tmp/bridge.txt
          echo "bridge=$bridge" >> "$GITHUB_OUTPUT"
          sha256sum core.aar | awk '{print "core_sha256=" $1}' >> "$GITHUB_OUTPUT"
          echo "core bridge: $bridge" >> "$GITHUB_STEP_SUMMARY"

      - name: kotlin comment balance
        # One stray `/*` inside a KDoc silently swallows the rest of the file, and Kotlin block comments
        # *nest*, so a nested opener does not even fix itself at the next `*/`: the failure surfaces as an
        # "unresolved reference" cascade in another file. Ten seconds here, instead of that again.
        run: |
          set -euo pipefail
          python3 "$GITHUB_WORKSPACE/tools/check-comments.py"

      - name: unit tests (the core contract)
        id: tests
        # تنها جایی در این پروژه که می‌شود «درست کار می‌کند» را بدون گوشی اثبات کرد: CoreProfiles و
        # net/Regime عمداً بدون Android نوشته شده‌اند. پیش از بسته‌بندی اجرا می‌شود، چون یک پروفایلِ
        # غیرقابل‌پارس از بیرون دقیقاً مثل «سرور مرده» به‌نظر می‌رسد و هیچ لاگی ندارد.
        working-directory: android
        run: |
          # `set +e` و نه `|| true`: شلِ پیش‌فرضِ اکشنز با -e اجرا می‌شود، پس بی این خط
          # gradle که می‌سوخت step همان‌جا می‌مرد - بدون rc، بدون ::error::، بدون گزارش.
          # اما `|| true` هم دروغ می‌گفت: خودش PIPESTATUS را صفر می‌کند و «تست‌ها سبز»
          # را به‌جای قرمز نشان می‌داد. خاموش‌کردنِ -e هر دو مشکل را حل می‌کند.
          set +e; set -uo pipefail
          gradle :app:testDebugUnitTest --no-daemon --console=plain --stacktrace \
            -PMEELANO_FEED_BASE="${{ inputs.feed_base || 'https://ainetmee.ir/v' }}" \
            2>&1 | tee "$GITHUB_WORKSPACE/test.log"
          rc="${PIPESTATUS[0]}"
          if [ "$rc" != 0 ]; then
            echo "::error::unit tests failed (rc=$rc) - see the PR comment"
            {
              echo "## unit tests — $rc"
              echo '```'
              grep -E "FAILED|expected:|AssertionError|^e: " "$GITHUB_WORKSPACE/test.log" | head -40
              # پیامِ واقعیِ assertion فقط در XML هست؛ gradle در کنسول آن را کوتاه می‌کند
              for f in app/build/test-results/testDebugUnitTest/*.xml; do
                [ -f "$f" ] || continue
                grep -o 'testcase name="[^"]*"\|failure message="[^"]*"' "$f" | cut -c1-260 | head -60
              done
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          exit "$rc"

      - name: build
        id: build
        continue-on-error: true
        working-directory: android
        env:
          MEELANO_FEED_BASE: ${{ inputs.feed_base || 'https://ainetmee.ir/v' }}
          MEELANO_FEED_KEY_IN: ${{ inputs.feed_key }}
          MEELANO_FEED_SECRET: ${{ secrets.MEELANO_FEED_SECRET }}
          SELF_UPDATE: ${{ inputs.self_update || 'true' }}
          # از تصمیمِ تک‌نقطه‌ایِ بالا؛ نه از ورودیِ dispatch که در رویدادِ تگ اصلاً وجود ندارد
          CORE_LINKED: ${{ steps.vr.outputs.core }}
          VARIANT: ${{ steps.vr.outputs.variant }}
        run: |
          set -euo pipefail
          task=":app:assemble${VARIANT^}"
          args=("$task" --no-daemon --console=plain --stacktrace
                -PMEELANO_FEED_BASE="$MEELANO_FEED_BASE"
                -PMEELANO_SELF_UPDATE="$SELF_UPDATE"
                -PMEELANO_CORE_LINKED="$CORE_LINKED")
          # وقتی job هسته AAR را ساخت/کش کرد، بیلدِ حاضر core-linked است — هر چیزی که «false» بگوید
          # یک حلقه‌ی سبز دروغین بود. ورودیِ dispatch همچنان راهِ بیلد گرفتن «بدون هسته» است (پرچم را
          # دستی false گذاشته باشی و core job هم اجرا نشود، همان false برنده است).
          # قاعده: اگر بالا AAR ساخته شد، این بیلد هسته دارد؛ job هسته فقط وقتی می‌دود که لینک
          # مطلوب بوده (تگ، یا dispatch با core_linked=true)، پس غافلگیری ناممکن است.
          if [ -n "${{ steps.bridge.outputs.bridge }}" ]; then
            args+=(-PMEELANO_CORE_LINKED=true -PMEELANO_CORE_BRIDGE_CLASS="${{ steps.bridge.outputs.bridge }}")
            echo "core-linked build: bridge=${{ steps.bridge.outputs.bridge }}" >> "$GITHUB_STEP_SUMMARY"
          fi
          # شناسه‌ای که روی گوشی دیده می‌شود: «کدام بیلد واقعاً نصب است» برای گزارش کاربر ضروری است
          args+=(-PMEELANO_BUILD_ID="${GITHUB_SHA::7}")
          [ -n "${MEELANO_FEED_KEY_IN:-}" ] && args+=(-PMEELANO_FEED_KEY="$MEELANO_FEED_KEY_IN")
          # سِکِرِتِ HMAC فقط برای *وریفای* آپدیت در کلاینت است؛ اگر ست نشده باشد فیلد خالی می‌ماند
          # و کلاینت امضای فایل را بررسی نمی‌کند — پس ریلیز واقعی بدون آن نساز.
          if [ -n "${MEELANO_FEED_SECRET:-}" ]; then args+=(-PMEELANO_FEED_SECRET="$MEELANO_FEED_SECRET"); fi
          gradle "${args[@]}" --continue 2>&1 | tee "$GITHUB_WORKSPACE/build.log"
          exit "${PIPESTATUS[0]}"

      # channel #3، وقتی هیچ‌کدام از دو راه بالا کار نمی‌کنند (میزبان blob از برخی محیط‌ها
      # مسدود است و gh pr comment هم بی‌صدا رد می‌شود): پیام خطا روی همین شاخه کامیت می‌شود.
      # [skip ci] در پیام الزامی است، وگرنه هر کامیت یک رانِ جدید می‌سازد و چرخه بسته نمی‌شود.
      - name: report into the branch
        if: always() && (steps.build.outcome == 'failure' || steps.tests.outcome == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BR: ${{ github.head_ref || github.ref_name }}
        run: |
          set +e; set -uo pipefail
          {
            echo "# گزارش خطای بیلد (خودکار؛ دفعهٔ بعد بازنویسی می‌شود)"
            echo
            echo '```'
            grep -E "FAILED|^e: |error:|expected:|AssertionError" "$GITHUB_WORKSPACE/test.log" 2>/dev/null | head -30 || true
            # build.log وقتی وجود ندارد که تست زودتر ترکیده — و `[ -f ]` نه‌به‌نه یعنی این step
            # با grepِ بی‌فایل بمیرد و هیچ گزارشی نوشته نشود (همین اتفاق افتاد)
            [ -f "$GITHUB_WORKSPACE/build.log" ] && grep -E "^e: |error:" "$GITHUB_WORKSPACE/build.log" | head -20 || true
            for f in android/app/build/test-results/testDebugUnitTest/*.xml; do
              [ -f "$f" ] || continue
              sed -n 's/.*\(<failure[^>]*message="[^"]*"/\1/p' "$f" | cut -c1-400 | head -12
            done
            echo '```'
          } > "$RUNNER_TEMP/CI-FAILURE.md"
          # نوشتن با Contents API، نه git push: همین‌جا مهم است که پیام *حتماً* جایی بنشیند، و
          # push از روی merge-refِ رویداد pull_request کار نمی‌کند (کامیتِ ادغام به شاخه راه نمی‌یابد).
          body=$(base64 -w0 "$RUNNER_TEMP/CI-FAILURE.md")
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/CI-FAILURE.md?ref=$BR" --jq .sha 2>/dev/null || true)
          args=(gh api -X PUT "repos/$GITHUB_REPOSITORY/contents/CI-FAILURE.md"
                -f message="ci: گزارش خطای بیلد [skip ci]" -f content="$body" -f branch="$BR")
          [ -n "$sha" ] && args+=(-f sha="$sha")
          "${args[@]}" >/dev/null || {
            # روی push تگ، branch= نام تگ است و نوشتن فایل شکست می‌خورد — جای رسیدنِ گزارش،
            # ایشوی «هضم‌ی خطای بیلد» است که خودکار باز/به‌روز می‌شود (تابعِ هشدار قبلی: || true خاموش).
            echo "::warning::writing CI-FAILURE.md to '$BR' failed (tag refs are not branches) -> filing an issue instead"
            title="CI failure digest"
            num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number' 2>/dev/null || true)
            if [ -n "$num" ]; then
              gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/CI-FAILURE.md" >/dev/null 2>&1 \
                || gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/CI-FAILURE.md" >/dev/null 2>&1 || true
            else
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body-file "$RUNNER_TEMP/CI-FAILURE.md" >/dev/null 2>&1 || true
            fi
          }

      # لاگ کامل از این سندباکس قابل دانلود نیست (میزبان blob)، پس خلاصه‌ی خطاها را به‌شکل
      # کامنت روی PR برمی‌گردانیم: خواندنی‌ترین راه برای دیدن «چرا build نشد» بدون دسترسی به Actions.
      - name: report to PR
        # continue-on-error on purpose: a *reporting* failure (no comment permissions on a push event, an
        # empty log, a gh hiccup) must never be the reason a good build is red - and before this, it was.
        continue-on-error: true
        if: ${{ always() && github.event_name == 'pull_request' }}
        working-directory: ${{ github.workspace }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.number }}
        run: |
          # `set +e` الزامی است: شلِ پیش‌فرضِ اکشنز با -e اجرا می‌شود و این گزارش‌دهنده پر از
          # grep/ls جست‌وجوگر است؛ بدون این خط، اولین grep بدون تطبیق step را می‌کشت (annotation
          # «Process completed with exit code 1» روی هر بیلدِ سبز)، کامنت هرگز پست نمی‌شد و
          # continue-on-error هم آن را بی‌صدا می‌پوشاند. گزارش‌دهنده نباید هرگز بمیرد.
          set +e; set -uo pipefail
          # هر دو لاگ: اگر unit tests بترکند، build.log اصلاً وجود ندارد و گزارش بی‌محتوا می‌شد
          log=build.log
          if [ ! -f "$log" ] && [ -f test.log ]; then log=test.log; fi
          [ -f "$log" ] || { echo "no build log"; exit 0; }
          # جزئیاتِ تست همیشه می‌چسبد، حتی وقتی build.log اصلاً ساخته نشده (تست زودتر ترکیده):
          # بیِ پیامِ assertion، «testDebugUnitTest FAILED» هیچ چیزی برای رفع کردن دست نمی‌دهد
          extra=$(grep -E "FAILED|expected:|AssertionError" test.log 2>/dev/null | head -25)
          xml=$(ls android/app/build/test-results/testDebugUnitTest/*.xml 2>/dev/null | head -6)
          if [ -n "$xml" ]; then
            det=$(grep -ho 'failure message="[^"]*"' $xml 2>/dev/null | cut -c1-300 | head -20)
            if [ -n "$det" ]; then extra=$(printf '%s\n%s\n' "$extra" "$det"); fi
          fi
          # بلوک «چه اشتباهی شد» + ۱۲۰ خط آخر لاگ: در مرحله‌ی configuration هیچ خطای
          # کامپایلوری وجود ندارد و بدون این، لاگ بی‌فایده است
          {
            echo "## build apk — خروج"
            echo
            echo '```'
            grep -A24 "\* What went wrong" "$log" | head -60 || true
            grep -E "^> Task .*FAILED|^[a-zA-Z]+: error:|Caused by:" "$log" | head -20 || true
            # خودِ خطا + ۷ خط بعدش: «None of the following candidates is applicable» بی لیستِ
            # نامزدها هیچی بهت نمی‌گوید؛ کامپایلور اورلودهای درست را همان‌جا ردیف می‌کند
            awk '/^e: file:\/\//{p=8} p&&p--' "$log" | head -160 || true
            if [ -n "${extra:-}" ]; then echo; echo "### unit tests"; echo; echo '```'; echo "$extra"; echo '```'; fi
            echo '```'
            echo
            echo "<details><summary>۱۲۰ خط آخر لاگ gradle</summary>"
            echo
            echo '```'
            tail -40 "$log" | sed "s#$(pwd)/android/##g"
            echo '```'
            echo "</details>"
          } > report.md
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body-file report.md || true

      - name: surface failure text
        # کانال سوم، و تنها کانالی که *همیشه* کار می‌کند: annotation روی همین check-run.
        # artifact روی میزبان blob است (از بسیاری محیط‌های سندباکسی/جغرافیایی مسدود) و
        # gh pr comment بدون مجوزِ issues:write بی‌صدا می‌میرد؛ ::error:: هیچ توکنی نمی‌خواهد
        # و شرحِ خطا را همان‌جا می‌چسباند. عمداً exit 0: گزارش‌دهندة خطا نباید خطای دوم بسازد.
        if: always() && (steps.build.outcome == 'failure' || steps.tests.outcome == 'failure')
        run: |
          set +e
          for f in "$GITHUB_WORKSPACE/test.log" "$GITHUB_WORKSPACE/build.log"; do
            [ -f "$f" ] || continue
            {
              grep -hE "^(e: |i: |Caused by:|> Task .* FAILED|\* What went wrong)" -A3 "$f"
              # کنسولِ gradle نامِ تستِ شکست‌خورده را می‌گوید؛ expected/actual فقط در XML است
              grep -hE "FAILED$" "$f" | head -12
              for x in android/app/build/test-results/testDebugUnitTest/*.xml; do
                [ -f "$x" ] || continue
                sed -n 's/.*<\(failure\|error\)[^>]*message="\([^"]*\)".*/\2/p' "$x" | cut -c1-240 | head -10
              done
              grep -hA10 "What went wrong" "$f"
            } | head -46 | tr -d '\r\001-\010' | sed -e 's/%/%25/g' -e '/^--$/d' -e 's/[<>&]/ /g' -e 's/^/::error::/'
          done
          exit 0

      - name: clear failure report
        # گزارشِ خطا وقتی بیلد سبز شد بی‌معنی می‌شود؛ پاکش کن، وگرنه ماهِ بعد یک
        # CI-FAILURE.md کهنه وسط درخت آویزان است و همه فکر می‌کنند بیلد خراب است.
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BR: ${{ github.head_ref || github.ref_name }}
        run: |
          set +e
          sha=$(gh api "repos/$GITHUB_REPOSITORY/contents/CI-FAILURE.md?ref=$BR" --jq .sha 2>/dev/null)
          [ -n "$sha" ] || exit 0
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/contents/CI-FAILURE.md" \
            -f message="ci: گزارش خطای بیلد پاک شد - بیلد سبز است [skip ci]" \
            -f sha="$sha" -f branch="$BR" >/dev/null && echo "removed stale CI-FAILURE.md"
          exit 0

      - name: collect + hash
        id: out
        if: steps.build.outcome == 'success'
        run: |
          set -euo pipefail
          variant="${{ steps.vr.outputs.variant }}"
          dir="android/app/build/outputs/apk/$variant"
          arm64=$(find "$dir" -type f -name '*arm64-v8a*.apk' | head -1)
          universal=$(find "$dir" -type f -name '*universal*.apk' | head -1)
          [ -n "$arm64" ] || { echo "::error::arm64-v8a APK تولید نشد"; exit 1; }
          [ -n "$universal" ] || { echo "::error::universal APK تولید نشد"; exit 1; }
          # The canonical backend-scannable name is intentionally the arm64 APK: that is the primary
          # Android-phone deliverable. Universal stays a separately named CI/Release fallback.
          signing="${{ steps.ks.outputs.signing }}"
          [ -n "$signing" ] || signing=signed     # بیلدهای debug این step را رد می‌کنند
          # نامِ فایلِ بی‌امضا صریحاً `-unsigned` می‌گیرد: هیچ راهی نباید باشد که کسی این را با
          # نسخه‌ی نهایی اشتباه بگیرد (Version.php هم چنین نامی را رد می‌کند، پس بی‌صدا به فید نمی‌رود).
          if [ "$variant" = debug ]; then
            # نامِ بیلدِ debug همیشه `-debug` می‌گیرد (همان قاعده‌ی تاریخیِ `meelano-2.0.0-200000-debug.apk`):
            # یک APKِ کلید-debug/بی‌هسته هرگز نباید با نامِ رسمیِ نسخه‌ی نهایی عوض شود — نه در دانلودِ
            # کاربر، نه در public_html/v/apk/ که Version.php از رویِ نام حدس می‌زند و خودش را
            # به‌روزرسانیِ کاربران می‌کند.
            out="meelano-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-debug.apk"
            uout="meelano-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-debug-universal.apk"
          elif [ "$signing" = unsigned ]; then
            out="meelano-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-unsigned.apk"
            uout="meelano-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-unsigned-universal.apk"
          else
            out="meelano-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}.apk"
            uout="meelano-${{ steps.ver.outputs.name }}-${{ steps.ver.outputs.code }}-universal.apk"
          fi
          cp "$arm64" "./$out"
          cp "$universal" "./$uout"

          # امضا را *می‌سنجیم*، فرض نمی‌کنیم. اگر کسی روی تگ نهایی بیلد debug بدهد (یا keystore در
          # واقع اعمال نشود)، این‌جا قرمز می‌شود — نه روی گوشیِ کاربر که «به‌روزرسانی نصب نشد» می‌بیند
          # ولی دلیلش را نمی‌داند. اثر گواهی در یادداشت ریلیز می‌رود تا ریلیز بعدی قابل‌مقایسه باشد.
          norm() { tr 'A-Z' 'a-z' < /dev/stdin | tr -d ':\r '; }
          # apksigner روی PATH نیست؛ داخل build-tools هر SDK است. اول PATH، بعد ANDROID_HOME،
          # بعد مسیر پیش‌فرضِ رانرها — و اگر هیچ‌کدام نبود، release قرمز می‌شود (نه اینکه با
          # خیالِ خوشِ «حتماً امضا شده» منتشر شود). `head -1` داخل || true: sed با بستنِ pipe
          # سیگنال SIGPIPE می‌گیرد و با pipefail کلِ step می‌مرد.
          if ! command -v apksigner >/dev/null 2>&1; then
            for sdk in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
              [ -n "$sdk" ] && [ -d "$sdk/build-tools" ] || continue
              bt=$(ls -d "$sdk"/build-tools/* 2>/dev/null | sort -V | tail -1 || true)
              if [ -n "${bt:-}" ] && [ -x "$bt/apksigner" ]; then export PATH="$bt:$PATH"; break; fi
            done
            unset sdk bt 2>/dev/null || true
          fi
          echo "apksigner: $(command -v apksigner || echo 'not found')"
          signer=""
          if command -v apksigner >/dev/null 2>&1; then
            signer=$( (apksigner verify --print-certs "$out" 2>/dev/null \
              | sed -n 's/.*certificate SHA-256 digest: *//p' | head -1 | norm) || true)
          fi
          debug_signer=""
          if [ -f "$HOME/.android/debug.keystore" ] && command -v keytool >/dev/null 2>&1; then
            debug_signer=$( (keytool -list -v -keystore "$HOME/.android/debug.keystore" \
              -alias androiddebugkey -storepass android -keypass android 2>/dev/null \
              | sed -n 's/.*SHA256: *//p' | head -1 | norm) || true)
          fi
          echo "signer=${signer:-unknown} debug_signer=${debug_signer:-absent} signing=$signing"
          if [ "$signing" = unsigned ]; then
            echo "::warning::$out بدون امضا است (تمرینِ release بدون keystore). برای انتشار، با keystore پروژه امضا کن: tools/sign-apk.sh"
          elif [ "${{ steps.vr.outputs.variant }}" = "release" ]; then
            if [ -z "$signer" ]; then
              echo "::error::apksigner در دسترس نبود — نمی‌توان تأیید کرد APK نهایی با keystore پروژه امضا شده است"
              exit 1
            fi
            if [ -n "$debug_signer" ] && [ "$signer" = "$debug_signer" ]; then
              echo "::error::APK نهایی با کلید debug امضا شده، نه با keystore پروژه (secretها/keystore.properties را چک کن)"
              exit 1
            fi
          fi

          sha=$(sha256sum "$out" | cut -d' ' -f1)
          usha=$(sha256sum "$uout" | cut -d' ' -f1)
          size=$(stat -c%s "$out")
          usize=$(stat -c%s "$uout")
          {
            echo "## APK اصلی: $out"
            echo
            echo "| خروجی | ABI | حجم | SHA-256 |"
            echo "|---|---|---:|---|"
            echo "| \`$out\` | arm64-v8a | $size | \`$sha\` |"
            echo "| \`$uout\` | universal (arm64 + v7a) | $usize | \`$usha\` |"
            echo
            echo "نصب: \`adb install -r $out\`"
            echo "مسیر هاست: \`public_html/v/apk/$out\` (فایل اصلی arm64، بدون تغییرنام)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "file=$out" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          echo "size=$size" >> "$GITHUB_OUTPUT"
          echo "universal_file=$uout" >> "$GITHUB_OUTPUT"
          echo "universal_sha256=$usha" >> "$GITHUB_OUTPUT"
          echo "universal_size=$usize" >> "$GITHUB_OUTPUT"
          echo "signer_sha256=$signer" >> "$GITHUB_OUTPUT"

      # Release با APK + sha256 + آیکون ۵۱۲. چرا Release و نه Artifact: artifact بعد از ۹۰ روز
      # می‌میرد و صفحه‌اش برای هر دانلود دوباره redirect می‌کند؛ asset یک ریلیز لینک مستقیم و ثابت است
      # که می‌شود آن را کپی کرد روی public_html/v/apk/ و به کاربران داد.
      # از PR هیچ‌وقت ریلیز منتشر نمی‌شود — نه از این شاخه و نه از آن یکی. تمرینِ release مسیرش
      # جداست: برچسبِ release-dry-run بیلدِ release می‌سازد و APK امضاشده را به‌عنوان artifact
      # می‌دهد (`gh run download <run> -n meelano-apk-release`) بی آنکه چیزی عمومی شود. تا پیش از
      # این، شرط به نامِ یک شاخه‌ی ادغام‌شده‌ی قدیمی گره خورده بود؛ یعنی «انتشار از PR» فقط برای
      # همان یک شاخه ممکن بود و برای بقیه بی‌صدا رد می‌شد.
      - name: publish release
        # فقط از تگ (یا dispatchِ صریحِ variant=release) — نه از push معمولی به main. مستندات همین
        # را می‌گویند (docs/ANDROID-BUILD.md «راه دوم: Artifact از همان Run — بدون ریلیز» و README
        # «فقط تگ به انتشار می‌رسد»)؛ پیش از این، هر push به main یک ریلیز debug می‌ساخت که چون
        # prerelease نبود «Latest» را می‌دزدید و APKِ بی‌هسته/کلید-debug را با نامِ رسمیِ نسخه‌ی
        # نهایی جلوی کاربر می‌گذاشت (۹ ریلیزِ apk-*-debug انباشته شده بود و پاک شدند).
        if: >-
          steps.out.outputs.file != '' &&
          github.event_name != 'pull_request' &&
          (startsWith(github.ref, 'refs/tags/') || steps.vr.outputs.variant == 'release')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILE: ${{ steps.out.outputs.file }}
          SHA: ${{ steps.out.outputs.sha256 }}
          SIZE: ${{ steps.out.outputs.size }}
          UFILE: ${{ steps.out.outputs.universal_file }}
          USHA: ${{ steps.out.outputs.universal_sha256 }}
          USIZE: ${{ steps.out.outputs.universal_size }}
          SIGNER: ${{ steps.out.outputs.signer_sha256 }}
          VARIANT: ${{ steps.vr.outputs.variant }}
          BOOTSTRAP: ${{ steps.vr.outputs.bootstrap }}
          VNAME: ${{ steps.ver.outputs.name }}
        run: |
          set -uo pipefail
          target=""
          if [ "$BOOTSTRAP" = "true" ]; then
            # تگِ بوت‌استرپ (`bootstrap-key-*`) اسمِ انتشار نیست؛ نامِ انتشار همان نسخه‌ی خودِ
            # بیلد است (`v2.5.0`) و تگ را همین‌جا با --target می‌سازیم (ساختِ تگ از API رویدادِ
            # push تولید نمی‌کند، پس run دوباره‌ای شروع نمی‌شود).
            tag="v${VNAME}"
            target="$GITHUB_SHA"
          else
            case "$GITHUB_REF" in
              refs/tags/*) tag="${GITHUB_REF_NAME}" ;;
              *) tag="apk-$(date -u +%Y%m%d-%H%M)-${VARIANT}" ;;
            esac
          fi
          # فقط ۶۴ هگز، نه قالبِ sha256sum: Version.php::checksum() همین را می‌خواهد (هرچند از
          # نسخه‌ی تازه، قالبِ sha256sum را هم می‌خواند)
          printf '%s\n' "$SHA" > "$FILE.sha256"
          printf '%s\n' "$USHA" > "$UFILE.sha256"
          pre=""
          case "$tag" in *alpha*|*beta*|*rc*) pre="--prerelease" ;; esac
          {
            echo "بیلد \`${VARIANT}\` از کامیت \`${GITHUB_SHA::7}\` — تگ \`$tag\`"
            echo
            echo "- APK اصلی arm64-v8a: \`$FILE\` · $SIZE بایت · sha256: \`$SHA\`"
            echo "- APK universal (arm64 + v7a): \`$UFILE\` · $USIZE بایت · sha256: \`$USHA\`"
            echo "- نصب روی گوشی: \`adb install -r $FILE\`"
            echo "- برای آپدیت خودکار: \`$FILE\` و \`$FILE.sha256\` را در \`public_html/v/apk/\` بگذار — نام فایل از قبل با قاعده‌ی \`Version.php::scan()\` می‌خواند، پس تغییرنام لازم نیست"
            if [ "$BOOTSTRAP" = "true" ]; then
              echo "- امضا: **کلیدِ تازه‌ی پروژه** (بوت‌استرپ، RSA 4096) — بیلد debug نیست. کلید در release پیش‌نویس جداگانه نگه داشته شده تا مالکِ مخزن برش دارد و از این پس انتشارها با همان کلید امضا شوند"
            elif [ "$VARIANT" = "release" ]; then
              echo "- امضا: keystore **خودِ پروژه** (secretهای MEELANO_*) — بیلد debug نیست، پس همین فایل را روی هاست بگذار"
              echo "- همین کلید ثابت است، پس این APK روی نصب‌های قبلیِ همین بسته به‌روزرسانی می‌شود؛ فقط بیلد debug کنار گذاشته می‌شود (applicationId آن \`…​.debug\` است)"
            else
              echo "- این بیلد debug است (کلید debug). ریلیز کاربران را با keystore خودت بساز: docs/ANDROID-BUILD.md"
            fi
            [ -n "${{ steps.bridge.outputs.core_sha256 }}" ] && echo "- هسته: libXray ${{ env.LIBXRAY_TAG }} — bridge \`${{ steps.bridge.outputs.bridge }}\` · core.aar sha256 \`${{ steps.bridge.outputs.core_sha256 }}\`"
            [ -n "${SIGNER:-}" ] && echo "- گواهی امضا (SHA-256): \`$SIGNER\` — ریلیزهای بعدی باید همین اثر را بدهند، وگرنه به‌روزرسانی روی نصب قبلی رد می‌شود"
            if [ "$VARIANT" = "release" ]; then
              echo "- ⚠️ اگر نسخه‌ی نصب‌شده‌ی قبلی با کلید دیگری امضا شده، فقط یک‌بار باید حذف/نصب شود؛ از این نسخه به بعد به‌روزرسانی بدون حذف کار می‌کند"
            else
              echo "- ⚠️ اگر نصب به‌روزرسانی خطا داد: بیلدهای debug روی هر رانر امضای متفاوت می‌گیرند — نسخه‌ی قبلی را کامل پاک کن بعد نصب کن"
            fi
          } > notes.md
          assets="$FILE $FILE.sha256 $UFILE $UFILE.sha256"
          [ -f design/preview/assets/ic-store-512.png ] && assets="$assets design/preview/assets/ic-store-512.png"
          # خروجی کامل gh به‌صورت annotation: لاگ build از بیرون قابل دانلود نیست، این تنها کانال اطمینان‌یافتنی است
          gh release create "$tag" $assets ${target:+--target "$target"} --title "Meelano VPN — $tag ($VARIANT)" --notes-file notes.md $pre >rel.log 2>&1 \
            || gh release upload "$tag" $assets --clobber >>rel.log 2>&1 \
            || { echo "::error::release failed — $(tr '\n' '|' < rel.log | cut -c1-500)"; exit 1; }
          url=$(gh release view "$tag" --json url -q .url)
          echo "$url"
          for f in $assets; do echo "asset: $f -> $url/download/$f"; done
          {
            echo "### لینک دانلود APK"; echo
            echo "$url/download/$FILE"; echo
            echo "- arm64 sha256: \`$SHA\` · حجم: $SIZE بایت"
            echo "- universal: $url/download/$UFILE · sha256: \`$USHA\` · حجم: $USIZE بایت"
          } >> "$GITHUB_STEP_SUMMARY"

          # کلیدِ بوت‌استرپ: به‌صورت **draft** برمی‌گردد. draft برای عموم (و برای هر کسی جز
          # صاحبِ مخزن) نامرئی است، پس کلید و رمزها عمومی نمی‌شوند. صاحبِ مخزن برش می‌دارد،
          # چهار secret را ست می‌کند و این draft را پاک می‌کند.
          if [ "$BOOTSTRAP" = "true" ]; then
            ktag="key-bootstrap-${VNAME}"
            {
              echo "# کلیدِ امضای M•A VPN — بوت‌استرپ"
              echo
              echo "این release **پیش‌نویس** است: فقط کسی که دسترسی push دارد آن را می‌بیند."
              echo
              echo "- تگِ بیلد: \`$GITHUB_REF_NAME\` · کامیت \`${GITHUB_SHA::7}\`"
              echo "- اثر گواهی APK منتشرشده (SHA-256): \`${SIGNER:-نامشخص}\`"
              echo
              echo "## کاری که باید بکنی"
              echo "1. \`meelano.keystore\` و \`keystore-credentials.txt\` را دانلود کن و در جای امن نگه دار."
              echo "2. چهار secret را از همان مقادیر ست کن تا انتشارهای بعدی با همین کلید امضا شوند (دستورها داخل فایل رمزها هست)."
              echo "3. همین draft را پاک کن — تنها نسخه‌ی کلید، فایلِ دانلودشدهٔ توست."
              echo
              echo "⚠️ اگر این کلید گم شود، کاربرانِ نسخه‌ی نصب‌شده فقط با حذف و نصبِ دوباره آپدیت می‌شوند."
            } > keynotes.md
            gh release create "$ktag" "$GITHUB_WORKSPACE/meelano.keystore" "$GITHUB_WORKSPACE/keystore-credentials.txt" \
              --draft --target "$GITHUB_SHA" --title "کلید امضا — بوت‌استرپ $VNAME (پیش‌نویس، پاک کن بعد از برداشتن)" \
              --notes-file keynotes.md >key.log 2>&1 \
              || echo "::warning::ساختِ draft کلید نشد — $(tr '\n' '|' < key.log | cut -c1-300)"
            echo "### کلید بوت‌استرپ" >> "$GITHUB_STEP_SUMMARY"
            echo "release پیش‌نویس \`$ktag\` ساخته شد (کلید + رمزها). آن را بردار و بعد پاکش کن." >> "$GITHUB_STEP_SUMMARY"
          fi

      # channel #2: artifact. وقتی کسی به Actions دسترسی ندارد (یا gh pr comment بی‌صدا رد می‌شود،
      # که در این مخزن رخ داده)، «چرا قرمز شد» بدون لاگ یعنی حدس‌زدنِ کور. لاگِ خام به‌عنوان
      # artifact پیوست می‌شود: `gh run download <run> -n meelano-failure-log`. فقط روی شکست، فقط
      # دو فایلِ لاگ، ۷ روز.
      - name: failure log
        # اگر این step وسط کار می‌ماند هیچ‌وقت اجرا نمی‌شد: build با continue-on-error شغل
        # شکست‌خورده حساب نمی‌کند، پس failure() نادرست بود و لاگ هیچ‌جا نمی‌رسید.
        if: always() && (steps.build.outcome == 'failure' || steps.tests.outcome == 'failure')
        uses: actions/upload-artifact@v4
        with:
          name: meelano-failure-log
          path: |
            ${{ github.workspace }}/test.log
            ${{ github.workspace }}/build.log
          if-no-files-found: ignore
          retention-days: 7

      - uses: actions/upload-artifact@v4
        # `if` و `ignore` لازم‌اند: بی آن‌ها وقتی build نمی‌سوزد این step با «Input required and
        # not supplied: path» قرمز می‌شود و خطای *واقعی* را زیر خودش گم می‌کند.
        if: steps.out.outcome == 'success'
        with:
          name: meelano-apk-${{ steps.vr.outputs.variant }}
          path: |
            ${{ steps.out.outputs.file }}
            ${{ steps.out.outputs.universal_file }}
            ${{ steps.out.outputs.file }}.sha256
            ${{ steps.out.outputs.universal_file }}.sha256
          if-no-files-found: ignore
          retention-days: 30
